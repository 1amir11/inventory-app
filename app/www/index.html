<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<title>مخزون المطبخ والكافتيريا</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <span id="app-title">مخزون المطبخ والكافتيريا</span>
    <span id="demo-badge" class="hidden">بيانات تجريبية</span>
    <label>المستخدم
      <select id="user-select"></select>
    </label>
    <label>تاريخ اليوم التجاري
      <input type="date" id="day-input">
    </label>
    <button id="load-day" class="big">عرض اليوم</button>
    <button id="quit-btn" class="big danger">إغلاق البرنامج</button>
  </header>
  <nav id="tabs">
    <button data-tab="day" class="big tab active">الجرد اليومي</button>
    <button data-tab="items" class="big tab">الأصناف والمنتجات</button>
    <button data-tab="reports" class="big tab">التقارير</button>
  </nav>
  <main id="content">
    <section id="tab-day">
      <div id="setup-box" class="hidden box">
        <h2>إعداد أول تشغيل</h2>
        <p>قاعدة البيانات فارغة. أنشئ المستخدمين ثم المواد والمنتجات.</p>
        <input id="new-user-name" placeholder="اسم المستخدم" maxlength="100">
        <button id="add-user-btn" class="big">إضافة مستخدم</button>
      </div>
      <h2>الجرد: <span id="day-label"></span> <span id="day-status"></span></h2>
      <div id="day-scroll">
        <table id="counts-table">
          <thead><tr>
            <th>الصنف</th><th>افتتاحي</th><th>وارد</th>
            <th>إضافة وارد</th><th>إغلاق</th><th>مستهلك</th>
          </tr></thead>
          <tbody id="counts-body"></tbody>
        </table>
        <div class="box">
          <h3>الكميات المباعة (الأطباق)</h3>
          <div id="sales-box"></div>
        </div>
        <div class="box">
          <h3>القهوة</h3>
          <div id="coffee-box"></div>
        </div>
        <div class="box">
          <button id="close-day-btn" class="big danger">إغلاق اليوم</button>
          <button id="backup-btn" class="big">نسخة احتياطية</button>
        </div>
        <div class="box" id="report-box"><h3>تقرير اليوم</h3><div id="report"></div></div>
      </div>
    </section>
    <section id="tab-items" class="hidden">
      <div class="box">
        <h3>مادة جديدة</h3>
        <input id="m-name" placeholder="الاسم" maxlength="100">
        <select id="m-dept"><option value="cafeteria">كافتيريا</option><option value="kitchen">مطبخ</option></select>
        <select id="m-base"><option value="g">جرام</option><option value="ml">مللي</option><option value="piece">قطعة</option></select>
        <label><input type="checkbox" id="m-cup"> كوب تغليف</label>
        <input id="m-unit" placeholder="وحدة عد (مثال: كرتونة)" maxlength="50">
        <input id="m-factor" type="number" min="1" step="1" placeholder="المعامل">
        <input id="m-cost" type="number" min="0" step="1" placeholder="السعر بالقرش">
        <input id="m-date" type="date">
        <button id="m-add" class="big">إضافة مادة</button>
      </div>
      <div class="box"><h3>المواد</h3><div id="materials-list"></div></div>
      <div class="box"><h3>المنتجات</h3><div id="products-list"></div></div>
    </section>
    <section id="tab-reports" class="hidden">
      <div class="box">
        <label>من <input type="date" id="rep-from"></label>
        <label>إلى <input type="date" id="rep-to"></label>
        <button id="rep-show" class="big">عرض</button>
        <a id="csv-link" class="big btn-link" href="#">تصدير CSV</a>
      </div>
      <div class="box"><div id="range-report"></div></div>
    </section>
  </main>
</div>
<div id="toast" class="hidden"></div>
<div id="modal-back" class="hidden">
  <div id="modal">
    <p id="modal-text"></p>
    <textarea id="modal-reason" rows="3" placeholder="اكتب السبب هنا"></textarea>
    <div>
      <button id="modal-ok" class="big">تأكيد بالسبب</button>
      <button id="modal-cancel" class="big">إلغاء</button>
    </div>
  </div>
</div>
<script src="strings.js"></script>
<script src="app.js"></script>
</body>
</html>
