<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<title></title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="components.css">
<link rel="stylesheet" href="screens.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <span id="app-title"></span>
    <span id="demo-badge" class="hidden"></span>
    <label class="small" for="user-select" id="user-label"></label>
    <select id="user-select"></select>
    <div class="seg" id="dept-seg" role="group">
      <button data-dept="kitchen" type="button"></button>
      <button data-dept="cafeteria" type="button"></button>
      <button data-dept="all" type="button"></button>
    </div>
    <button id="day-prev" type="button" title="">&#9654;</button>
    <button id="day-label" type="button" class="btn-secondary" style="font-weight:bold"></button>
    <button id="day-next" type="button" title="">&#9664;</button>
    <span id="day-chip"></span>
    <span style="flex:1"></span>
    <button id="quit-btn" type="button" class="btn-danger"></button>
  </header>
  <nav id="tabbar">
    <button class="tab" data-tab="close" type="button"></button>
    <button class="tab" data-tab="report" type="button"></button>
    <button class="tab" data-tab="archive" type="button"></button>
    <button class="tab" data-tab="products" type="button"></button>
    <button class="tab" data-tab="backup" type="button"></button>
  </nav>
  <main id="content"></main>
  <footer id="actionbar" class="hidden"></footer>
</div>
<div id="toast" class="hidden" role="status"></div>
<div id="dlg-back" class="hidden"><div id="dlg" role="dialog"></div></div>
<div id="cal-root"></div>
<div id="audit-badge" class="hidden" style="position:absolute;top:0;left:0;background:#000;color:#fff;font-size:12px;z-index:99;padding:2px 6px;"></div>
<script src="strings.js"></script>
<script src="api.js"></script>
<script src="format.js"></script>
<script src="dates.js"></script>
<script src="ui.js"></script>
<script src="screen-close.js"></script>
<script src="screen-report.js"></script>
<script src="screen-archive.js"></script>
<script src="screen-products.js"></script>
<script src="screen-backup.js"></script>
<script src="app.js"></script>
</body>
</html>
